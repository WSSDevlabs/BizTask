name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows a manual "Run workflow" from the Actions tab

# Never run two production deploys at the same time; a newer push cancels an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc -b` first, so type errors fail the deploy here.
      - name: Type check & build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_HR_MASTER_EMAIL: ${{ secrets.VITE_HR_MASTER_EMAIL }}
          VITE_HR_LOGIN_SHORTCUT: ${{ secrets.VITE_HR_LOGIN_SHORTCUT }}

      # Skipped (not failed) until the FIREBASE_SERVICE_ACCOUNT secret is added.
      - name: Authenticate to Google Cloud
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules & indexes
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: >
          npx --yes firebase-tools@14 deploy
          --only firestore:rules,firestore:indexes
          --project ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          --non-interactive

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=biztask --branch=main --commit-hash=${{ github.sha }}

name: CI

on:
  # main is checked by deploy.yml on every push, so only develop and PRs run here.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-blocking until the existing lint backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `npm run build` runs `tsc -b` first, so this is also the type check.
      - name: Type check & build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_HR_MASTER_EMAIL: ${{ secrets.VITE_HR_MASTER_EMAIL }}
          VITE_HR_LOGIN_SHORTCUT: ${{ secrets.VITE_HR_LOGIN_SHORTCUT }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
